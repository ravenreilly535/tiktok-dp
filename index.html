<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Profile Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: #fff; }
        .box { background: #1e1e1e; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 10px; outline: none; }
        input:focus { border-color: #fe2c55; }
        button { padding: 10px 20px; background: #fe2c55; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 85%; }
        button:hover { background: #e0244d; }
        .result { margin-top: 20px; }
        .avatar-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #fe2c55; margin-bottom: 15px; }
        .profile-name { font-size: 20px; font-weight: bold; color: #fff; margin: 5px 0 2px 0; }
        .username { font-size: 14px; color: #888; margin-bottom: 15px; }
        .stats-container { display: flex; justify-content: space-around; margin: 15px 0; background: #2a2a2a; padding: 10px; border-radius: 8px; }
        .stat-box { text-align: center; }
        .stat-box span { display: block; font-size: 13px; color: #aaa; }
        .stat-box b { font-size: 15px; color: #fff; }
    </style>
</head>
<body>

<div class="box">
    <h2>TikTok Profile Viewer</h2>
    <form id="dpForm">
        <input type="text" id="username" placeholder="Enter username (e.g. ibadhussain738)" required>
        <br>
        <button type="submit">Search Profile</button>
    </form>
    
    <div class="result" id="resultArea"></div>
</div>

<script>
document.getElementById('dpForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    let username = document.getElementById('username').value.trim();
    username = username.replace('@', ''); 
    const resultArea = document.getElementById('resultArea');
    
    resultArea.innerHTML = "Fetching profile...";

    try {
        const apiUrl = `https://tikwm.com/api/user/info?unique_id=${username}`;
        // Yahan corsproxy.io use ki hai jo ziada fast aur heavy data ke liye behtar hai
        const proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(apiUrl);

        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (data && data.code === 0 && data.data) {
            const userInfo = data.data.user;
            const stats = data.data.stats;

            const avatarUrl = userInfo.avatar; 
            const nickname = userInfo.nickname; 
            const profileLink = `https://www.tiktok.com/@${userInfo.unique_id}`;

            resultArea.innerHTML = `
                <img src="${avatarUrl}" alt="TikTok DP" class="avatar-img" crossorigin="anonymous">
                <div class="profile-name">${nickname}</div>
                <div class="username">@${userInfo.unique_id}</div>
                
                <div class="stats-container">
                    <div class="stat-box">
                        <b>${stats.following}</b>
                        <span>Following</span>
                    </div>
                    <div class="stat-box">
                        <b>${stats.follower}</b>
                        <span>Followers</span>
                    </div>
                    <div class="stat-box">
                        <b>${stats.heart}</b>
                        <span>Likes</span>
                    </div>
                </div>

                <br>
                <a href="${profileLink}" target="_blank" style="color: #fe2c55; text-decoration: none; font-weight: bold;">Open on TikTok</a>
            `;
        } else {
            resultArea.innerHTML = `<p style="color: red;">User not found or private profile!</p>`;
        }
    } catch (err) {
        resultArea.innerHTML = `<p style="color: red;">Failed to fetch data. Try again later.</p>`;
    }
});
</script>

</body>
</html>
