<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Custom API Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: #fff; }
        .box { background: #1e1e1e; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 90%; max-width: 500px; text-align: left; }
        input { padding: 10px; width: 70%; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 10px; outline: none; }
        input:focus { border-color: #fe2c55; }
        button { padding: 10px 15px; background: #fe2c55; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e0244d; }
        pre { background: #000; padding: 15px; border-radius: 5px; overflow-x: auto; color: #00ff00; font-size: 12px; max-height: 300px; }
        .center { text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <div class="center">
        <h2>My Custom TikTok API</h2>
        <form id="apiForm">
            <input type="text" id="username" placeholder="Enter username..." required>
            <button type="submit">Get JSON</button>
        </form>
    </div>
    
    <h3>API Response (JSON):</h3>
    <pre id="jsonResult">Ready...</pre>
</div>

<script>
document.getElementById('apiForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    let username = document.getElementById('username').value.trim();
    const jsonResult = document.getElementById('jsonResult');
    
    jsonResult.textContent = "Fetching from Vercel API...";

    try {
        // Yeh aapki apni Vercel serverless API ko hit karega (No CORS issue!)
        const response = await fetch(`/api/user?username=${encodeURIComponent(username)}`);
        const data = await response.json();

        // Screen par poora JSON array/object format mein show kar dega
        jsonResult.textContent = JSON.stringify(data, null, 4);

    }چاerr {
        jsonResult.textContent = "Error: Failed to fetch from API.";
    }
});
</script>

</body>
</html>
