<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok DP Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: #fff; }
        .box { background: #1e1e1e; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        input { padding: 10px; width: 80%; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 10px; outline: none; }
        input:focus { border-color: #fe2c55; }
        button { padding: 10px 20px; background: #fe2c55; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 85%; }
        button:hover { background: #e0244d; }
        .result { margin-top: 20px; }
        .avatar-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #fe2c55; }
    </style>
</head>
<body>

<div class="box">
    <h2>TikTok DP Finder</h2>
    <form id="dpForm">
        <input type="text" id="username" placeholder="Enter username (e.g. ibadhussain738)" required>
        <br>
        <button type="submit">Search DP</button>
    </form>
    
    <div class="result" id="resultArea"></div>
</div>

<script>
document.getElementById('dpForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    let username = document.getElementById('username').value.trim();
    username = username.replace('@', ''); 
    const resultArea = document.getElementById('resultArea');
    
    resultArea.innerHTML = "Fetching profile...";

    const apiUrl = `https://tikwm.com/api/user/info?unique_id=${username}`;
    
    // Do proxies ki list (Pehli fail ho gi toh dusri try hogi)
    const proxies = [
        `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`
    ];

    let data = null;

    for (let proxyUrl of proxies) {
        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) continue;

            let json = await response.json();
            
            // Agar allorigins proxy hai toh uska format alag hota hai (.contents)
            if (proxyUrl.includes('allorigins')) {
                data = JSON.parse(json.contents);
            } else {
                // corsproxy.io direct data deta hai
                data = json;
            }

            if (data && data.code === 0 && data.data) {
                break; // Agar data kamyabi se mil gaya toh loop rok do
            }
        } catch (err) {
            console.log("Proxy failed, trying next...");
        }
    }

    if (data && data.code === 0 && data.data) {
        const userInfo = data.data.user;
        const avatarUrl = userInfo.avatar; 
        const profileLink = `https://www.tiktok.com/@${userInfo.unique_id}`;

        resultArea.innerHTML = `
            <p><b>@${userInfo.unique_id}</b></p>
            <img src="${avatarUrl}" alt="TikTok DP" class="avatar-img">
            <br><br>
            <a href="${profileLink}" target="_blank" style="color: #fe2c55; text-decoration: none;">Open on TikTok</a>
        `;
    } else {
        resultArea.innerHTML = `<p style="color: red;">Failed to fetch data. Try again later.</p>`;
    }
});
</script>

</body>
</html>
